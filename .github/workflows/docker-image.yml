name: CI/CD Pipeline for Django Project

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build Docker Compose Services
      - name: Build Docker Images
        run: docker-compose -f IOT/docker-compose.yml build --progress=plain iot nginx

      # Step 4: List Docker Images (Debugging)
      - name: List Docker Images
        run: docker images

      # Step 5: Tag and Push Images to Docker Hub
      - name: Tag and Push Docker Images
        run: |
          docker tag IOT_iot:latest lakshanwanniarachchi/iot:latest
          docker tag IOT_nginx:latest lakshanwanniarachchi/nginx:latest
          docker push lakshanwanniarachchi/iot:latest
          docker push lakshanwanniarachchi/nginx:latest


